name: tasks

on:
  push:
    branches: [main]
  pull_request:

# The rules live in the engine, not in this file. Tightening a lint reaches every task
# repository as a version bump here — no template merge required.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AgentsLastExam/ale
          path: ale-engine

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint Task structure
        run: uv run --project ale-engine ale lint .

      - name: Oracles reach their declared scores
        run: |
          uv run --project ale-engine ale validate tasks/example_task
          uv run --project ale-engine ale validate tasks/demo/resource_injection
          uv run --project ale-engine ale validate tasks/demo/verification_deterministic
          uv run --project ale-engine ale validate tasks/demo/verification_domain_a
          uv run --project ale-engine ale validate tasks/demo/verification_domain_b
          uv run --project ale-engine ale validate tasks/demo/verification_separate

      - name: Guest code parses on Python 3.12
        run: |
          uv python install 3.12
          uv run --no-project --python 3.12 python -m compileall -q tasks

  live-llm-judge:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AgentsLastExam/ale
          path: ale-engine
      - uses: astral-sh/setup-uv@v5
      - if: env.OPENAI_API_KEY != ''
        run: uv run --project ale-engine ale validate tasks/demo/verification_llm_judge --set verification.llm.model=gpt-5.4-mini --set verification.llm.reasoning_effort=medium --set verification.llm.base_url=https://api.openai.com --set verification.llm.api_key_env=OPENAI_API_KEY

  live-agent-judge:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AgentsLastExam/ale
          path: ale-engine
      - uses: astral-sh/setup-uv@v5
      - name: Validate Codex Agent Judge
        if: env.OPENAI_API_KEY != ''
        run: uv run --project ale-engine ale validate tasks/demo/verification_agent_judge --set verification.agent.adapter=codex-cli --set verification.agent.version=0.147.0 --set verification.agent.model=gpt-5.4 --set verification.agent.reasoning_effort=high --set verification.agent.base_url=https://api.openai.com --set verification.agent.api_key_env=OPENAI_API_KEY
      - name: Validate Claude Agent Judge
        if: env.ANTHROPIC_API_KEY != ''
        run: uv run --project ale-engine ale validate tasks/demo/verification_agent_judge --set verification.agent.adapter=claude-code --set verification.agent.version=2.1.226 --set verification.agent.model=claude-sonnet-5 --set verification.agent.reasoning_effort=high --set verification.agent.base_url=https://api.anthropic.com --set verification.agent.api_key_env=ANTHROPIC_API_KEY
