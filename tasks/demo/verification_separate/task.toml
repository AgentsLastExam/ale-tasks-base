schema_version = "1.4+ale.1"
artifacts = ["/home/user/output/result.json", "/var/lib/ale-report"]

[task]
name = "agentslastexam/verification-separate"
keywords = ["demo", "verification", "separate"]

[environment]
cpus = 1
memory_mb = 4096

[agent]
user = "user"
timeout_sec = 300
network_mode = "no-network"

[verifier]
timeout_sec = 120
environment_mode = "separate"

[verifier.environment]
cpus = 1
memory_mb = 4096
