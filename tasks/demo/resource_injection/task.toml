schema_version = "1.4+ale.1"
artifacts = ["/home/user/output"]

[task]
name = "agentslastexam/resource-injection"
keywords = ["demo", "skills", "mcp", "resource-injection"]

[environment]
cpus = 1
memory_mb = 4096
skills_dir = "/skills"

[[environment.mcp_servers]]
name = "task-proof"
transport = "stdio"
command = "python3"
args = ["/opt/task-proof/task_proof_mcp.py"]

[agent]
user = "user"
timeout_sec = 300
network_mode = "no-network"

[verifier]
timeout_sec = 60
