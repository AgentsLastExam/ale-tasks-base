# The minimum a task must declare. Delete what you do not need — every field below
# except `image` has a working default.
#
# The identifier is NOT written here: it comes from this folder's path
# (tasks/example_task -> example-example_task, given domain `example`).

image: sandbox-base-cli
resources: { cpus: 1, memory_mb: 1024 }
network: { mode: block } # block | allowlist (+ allowed_hosts) | open
timeouts: { setup: 60, agent: 300, verify: 120 }

# Stages are symmetric: each names the data it needs and the shared libraries it uses.
# Scripts are not declared — this folder's setup/ and verify/ directories are copied in
# when their stage runs, and run.sh executes if present.
#
# A mount carries everything needed to find its data, so this file is readable on its
# own. Listing one under `verify` is what keeps it out of the sandbox while the agent
# works.
setup:
  assets: []
  # - repo: agents-last-exam/ale-tasks-assets
  #   revision: <commit>          # a commit, so two runs read the same bytes
  #   path: example/task/input
#   dest: /home/user/input      # your choice; keep agent-visible paths writable
  kits: []
verify:
  assets: []
  kits: [example_kit]

# Absolute paths holding this task's output. Whether a copy is kept is a run-level
# setting (`artifacts.collect`), not a task's business — the same task feeds a debugging
# run that keeps everything and a sweep that only wants scores.
artifacts: [/home/user/output]

# Values substituted into instruction.md as ${greeting}. Strict: every declared
# parameter must be used, and every ${placeholder} must be declared.
params:
  greeting: hello

# Optional. Each variant becomes its own task instance with its own identity.
# variants:
#   - { name: base }
#   - { name: loud, params: { greeting: HELLO } }

metadata: { tags: [example] }
